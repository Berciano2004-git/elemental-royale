# Despliegue en Fly.io. Cambia `app` por un nombre libre si ya está ocupado
# (`fly launch` lo reescribe solo). El resto ya está listo para el juego.
app = "elemental-royale"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Una partida vive en memoria del proceso: apagar la máquina por inactividad
  # cortaría las salas, así que se queda encendida.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  # El WebSocket cuenta como una conexión abierta, no como una petición.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
